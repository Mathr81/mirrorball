server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA pure : toute route inconnue retombe sur index.html (le routage,
  # minimal, se fait côté client sur window.location.pathname).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Front et API sous le même domaine : le reverse proxy public (Nginx Proxy
  # Manager) n'a qu'une seule cible, ce conteneur, qui relaie /api/ vers le
  # service `api` du réseau Docker Compose.
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Le service worker généré par vite-plugin-pwa doit être servi sans cache
  # pour que les mises à jour soient détectées rapidement.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
